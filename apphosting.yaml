# Firebase App Hosting backend configuration.
# https://firebase.google.com/docs/app-hosting/configure
# Values below mirror App Hosting defaults, except maxInstances which is
# capped as a cost guard for this mostly-static marketing site.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80
